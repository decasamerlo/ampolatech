# The web app and the API on one origin (ADR 0008).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Text compresses well, except the API's short answers, which gain a few
    # bytes. nginx compresses text/html once gzip is on, and gzip_types adds
    # the other types the app and the API answer with. Level 5 rather than
    # nginx's default of 1, since the bundle comes out markedly smaller and
    # the levels above 5 add little. A request a proxy forwards is compressed
    # too, and Vary keeps a shared cache from handing the compressed copy to
    # a client that didn't ask for it.
    gzip on;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/problem+json;

    # The backend on Compose's network, sent the Host the browser asked for,
    # port included, and where the request came from.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The build names each file after a hash of its content, so a file here
    # never changes, and a missing one is a 404 rather than the app.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a file of the build, else a page of the app's
    # router, which index.html loads; it is checked on every load, so a new
    # build reaches the browser at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
