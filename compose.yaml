# The backend and its database on one machine: `docker compose up --build`.
name: ampolatech

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ampolatech
      POSTGRES_PASSWORD: postgres-local
      # The roles backend/postgres/initdb creates. The backend's local profile
      # (application-local.yml) connects with the same passwords.
      AMPOLATECH_OWNER_PASSWORD: owner-local
      AMPOLATECH_APP_PASSWORD: app-local
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backend/postgres/initdb:/docker-entrypoint-initdb.d:ro
    # Only for running the backend outside Docker. Set AMPOLATECH_POSTGRES_PORT
    # when another database holds 5432.
    ports:
      - "127.0.0.1:${AMPOLATECH_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Over TCP, which PostgreSQL opens only once the init scripts are done.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=ampolatech"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    # From the repository root: the backend's build reads api/openapi.yaml.
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ampolatech
    # Only this machine: the demo sign-in signs in whoever connects.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
